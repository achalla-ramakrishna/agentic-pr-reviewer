spring:
  application:
    name: pr-reviewer
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

pr-reviewer:
  github:
    api-base-url: https://api.github.com
  openai:
    api-base-url: https://api.openai.com/v1
    model: gpt-4o

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:prreviewer;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  flyway:
    locations: classpath:db/migration/h2

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prreviewer}
    username: ${DB_USERNAME:prreviewer}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration/postgres
